# Dependabot proposes the bumps the pins need (audit TT3-12): the npm packages, the Actions pinned
# to commits in workflows and the base images pinned by digest in the Dockerfile. Monthly,
# one grouped patch/minor pull request per ecosystem; npm major upgrades are reviewed separately.
version: 2
updates:
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ['*']
        update-types: ['minor', 'patch']
      python-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # 7.4.2 emits unreferenced CSS chunks; keep the artifact gate intact until a fixed release.
      - dependency-name: astro
        versions: ['7.4.2']
      # The type checker and the Node runtime are upgraded deliberately with their tooling.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']
      npm-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # One Node major, the one .nvmrc names: a new major is a decision across .nvmrc, engines and
    # the image, not a bump (its first run proposed node 26-alpine).
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    groups:
      images:
        patterns: ['*']
