<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 150" width="960" height="150" role="img" aria-label="Valvet colour palette in dark and light theme">
  <defs>
    <pattern id="dmd" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="0.9" fill="#FF8A3D" fill-opacity="0.35"/></pattern>
    <pattern id="dmdl" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="0.9" fill="#C9520F" fill-opacity="0.35"/></pattern>
  </defs>
  <g font-family="'IBM Plex Mono', Consolas, Menlo, monospace" font-size="12">
    <!-- dark row -->
    <rect x="0" y="0" width="960" height="72" rx="8" fill="#0E0B10"/>
    <text x="14" y="42" fill="#A79FAE" font-family="'IM Fell English SC', Georgia, serif" font-size="18">Dark</text>
    <g transform="translate(90 12)">
      <rect width="96" height="48" rx="5" fill="#1A161D" stroke="#35303B"/><text x="8" y="42" fill="#ECE6DA">surface</text>
      <rect x="106" width="96" height="48" rx="5" fill="#17121A" stroke="#35303B"/><rect x="106" width="96" height="48" rx="5" fill="url(#dmd)"/><text x="114" y="42" fill="#FF8A3D">dmd-well</text>
      <rect x="212" width="96" height="48" rx="5" fill="#FF8A3D"/><text x="220" y="42" fill="#0E0B10">amber</text>
      <rect x="318" width="96" height="48" rx="5" fill="#B08D57"/><text x="326" y="42" fill="#0E0B10">brass</text>
      <rect x="424" width="96" height="48" rx="5" fill="#C9A0DC"/><text x="432" y="42" fill="#0E0B10">violet</text>
      <rect x="530" width="96" height="48" rx="5" fill="#6FCB8B"/><text x="538" y="42" fill="#0E0B10">ok</text>
      <rect x="636" width="96" height="48" rx="5" fill="#E3B557"/><text x="644" y="42" fill="#0E0B10">warn</text>
      <rect x="742" width="96" height="48" rx="5" fill="#F0857B"/><text x="750" y="42" fill="#0E0B10">bad</text>
    </g>
    <!-- light row -->
    <rect x="0" y="78" width="960" height="72" rx="8" fill="#EFE9DA"/>
    <text x="14" y="120" fill="#5E5766" font-family="'IM Fell English SC', Georgia, serif" font-size="18">Light</text>
    <g transform="translate(90 90)">
      <rect width="96" height="48" rx="5" fill="#F8F4EA" stroke="#D3CBB8"/><text x="8" y="42" fill="#1C1720">surface</text>
      <rect x="106" width="96" height="48" rx="5" fill="#17121A"/><rect x="106" width="96" height="48" rx="5" fill="url(#dmdl)"/><text x="114" y="42" fill="#FF8A3D">dmd-well</text>
      <rect x="212" width="96" height="48" rx="5" fill="#C9520F"/><text x="220" y="42" fill="#F8F4EA">amber</text>
      <rect x="318" width="96" height="48" rx="5" fill="#8A6B3A"/><text x="326" y="42" fill="#F8F4EA">brass</text>
      <rect x="424" width="96" height="48" rx="5" fill="#6A2D80"/><text x="432" y="42" fill="#F8F4EA">violet</text>
      <rect x="530" width="96" height="48" rx="5" fill="#2F7D46"/><text x="538" y="42" fill="#F8F4EA">ok</text>
      <rect x="636" width="96" height="48" rx="5" fill="#A5720B"/><text x="644" y="42" fill="#F8F4EA">warn</text>
      <rect x="742" width="96" height="48" rx="5" fill="#B8322A"/><text x="750" y="42" fill="#F8F4EA">bad</text>
    </g>
  </g>
</svg>
