# Rendered by the nginx image's envsubst on start; ${BASE_PATH} is "/" or "/TheAddamsFamilyHandbook/".
server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/html text/css application/javascript application/json image/svg+xml application/manifest+json;

  location ~* \.(png|jpg|webp|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
  location = ${BASE_PATH}sw.js {
    add_header Cache-Control "no-cache";
  }
  location ${BASE_PATH} {
    try_files $uri $uri.html $uri/index.html =404;
  }
  error_page 404 ${BASE_PATH}404.html;
}
