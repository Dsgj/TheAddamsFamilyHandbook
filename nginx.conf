# Rendered by the nginx image's envsubst on start; ${BASE_PATH} is "/" or "/TheAddamsFamilyHandbook/".
# scripts/docker-smoke.sh checks what it serves and how it caches (audit TT2-10).
server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  # text/html is always compressed; naming it again only draws a warning
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Astro's hashed bundle: a changed file gets a new name, so a year, immutable.
  location ^~ ${BASE_PATH}_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # The unhashed images and fonts (scans, brand, icons) keep their names from release to release:
  # a day, then revalidated, never immutable.
  location ~* \.(png|jpg|webp|woff2)$ {
    add_header Cache-Control "public, max-age=86400";
  }
  location = ${BASE_PATH}sw.js {
    add_header Cache-Control "no-cache";
  }
  location ${BASE_PATH} {
    try_files $uri $uri.html $uri/index.html =404;
  }
  error_page 404 ${BASE_PATH}404.html;
}
